[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classinus"
version = "0.6.1"
description = "Code avec les modeles GPT, Claude et DeepSeek, avec des reglages, dans un panneau a cote de ton code."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["thonny>=5.0.0", "keyring>=24", "sounddevice>=0.4"]
classifiers = ["Topic :: Education", "Programming Language :: Python :: 3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["thonnycontrib*"]
namespaces = true

[tool.setuptools.package-data]
"thonnycontrib.classinus" = ["defauts.json"]
