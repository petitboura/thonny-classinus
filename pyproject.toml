[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-classinus"
version = "0.6.3"
description = "Code with GPT, Claude, Gemini, DeepSeek and Grok models, with settings, in a panel next to your code."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["thonny>=5.0.0", "keyring>=24", "sounddevice>=0.4"]
classifiers = ["Topic :: Education", "Programming Language :: Python :: 3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["thonnycontrib*"]
namespaces = true

[tool.setuptools.package-data]
"thonnycontrib.classinus" = ["defauts.json"]
